# Caffeine is the one dependency the relocated platform does not already
# carry. **Its version is our choice, not JetBrains'** -- no -for-ide POM
# declares it, because these artifacts expect a running IntelliJ platform to
# provide it.
#
# **It must be 2.x, and this is an Android constraint rather than a taste.**
# Caffeine 3.x logs through `System.getLogger`, the Java 9 System.Logger API,
# which Android has never had -- so 3.1.8 works perfectly on a desktop JVM and
# dies on a device in Caffeine's static initialiser:
#   NoSuchMethodError: No static method getLogger(Ljava/lang/String;)
#     Ljava/lang/System$Logger; in class Ljava/lang/System;
# 2.9.3 is the last 2.x and uses java.util.logging, which Android does have.
# The Analysis API only touches Cache, CacheLoader, LoadingCache, RemovalCause
# and stats, all of which 2.x has.
1e0a7bbef1dd791653143f3f05d0e489934bf5481e58a87c9e619cd46b68729b  912143  caffeine.jar  com.github.ben-manes.caffeine:caffeine:2.9.3  central

# **kotlinx-collections-immutable is deliberately NOT here.** It was added once,
# because jdeps reported its classes unresolved exactly as it does for a missing
# library -- and adding it put a second, unshaded copy beside the one the
# compiler already shades. Nothing failed at link time. It surfaced much later,
# inside analysis, as a NoSuchMethodError on a FIR constructor identical but for
# that one parameter's package. It belongs in Relocate.java's SHADED list, and
# that is where it now is.

# kotlinx-serialization, by contrast, is genuinely absent: the IntelliJ platform
# shaded into the compiler reads plugin XML through
# com.intellij.util.xml.dom.XmlElement, which needs KSerializer, and no copy is
# bundled. The compiler never hits that path itself, so the compiler archive has
# been fine without it.
