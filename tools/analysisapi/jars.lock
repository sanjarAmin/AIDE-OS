# Caffeine is the one dependency the relocated platform does not already
# carry. **Its version is our choice, not JetBrains'** -- no -for-ide POM
# declares it, because these artifacts expect a running IntelliJ platform to
# provide it. 3.1.8 is the last 3.x built for Java 11, which is what the
# platform of this era uses. If a later Analysis API needs a newer one,
# nothing here will say so; the symptom would be a NoSuchMethodError inside
# the cache.
