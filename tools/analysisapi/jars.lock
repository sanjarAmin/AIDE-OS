# The Kotlin Analysis API jar set, for Kotlin code intelligence on device.
#
# These are what `:lsp:kotlin` needs and what `kotlin-compiler-embeddable`
# does NOT contain: the shipped compiler carries the K2 front end (4259 FIR
# classes) and zero Analysis API classes. See FINDINGS.md.
#
# **Not on Maven Central.** JetBrains publishes these only to their own
# repository (KT-56203 has been open about that for years), so every row here
# names `jetbrains` as its source and fetch-jars.sh knows the two hosts apart.
#
# **The POMs are wrong and must not be resolved.** Each `-for-ide` artifact
# declares dependencies -- analysis-api-standalone-base, analysis-api-fir-
# standalone-base, analysis-api-standalone -- that return 404 from the same
# repository, because they are shadowed *into* the -for-ide jar. A normal
# Maven or Gradle resolution therefore fails. Fetch the jars directly, by
# name, and ignore what they claim to depend on.
#
# The version is pinned to 2.2.10 to match kotlin-compiler-embeddable in
# ../kotlinc/jars.lock. The Analysis API binds to compiler internals; the two
# move together and a mismatched pair is not a supported combination.
#
# Format: <sha256>  <bytes>  <file>  <coordinate>  <source>
#
# `source` is `jetbrains` for the IntelliJ dependencies repository and
# `central` for Maven Central.

